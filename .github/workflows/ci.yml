name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: python {0}
    working-directory: retrolarium-studio
jobs:
  python:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-studio
      - name: Read pinned Core revision
        id: core_ref
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/core_pin.py"], check=True)
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          ref: ${{ steps.core_ref.outputs.sha }}
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "python"], check=True)
  native:
    name: Native Qt tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Qt 5.15.2 uses stdext iterators removed in MSVC 14.51.
        # Keep its native Windows build on the compatible VS 2022 toolset.
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-studio
      - name: Read pinned Core revision
        id: core_ref
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/core_pin.py"], check=True)
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          ref: ${{ steps.core_ref.outputs.sha }}
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host Qt, build and run native tests
        run: |
          import os, subprocess, sys
          if sys.platform == "win32":
              os.environ["CMAKE_GENERATOR"] = "Visual Studio 17 2022"
          subprocess.run([sys.executable, "tools/ci_native.py"], check=True)
