name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: python {0}
    working-directory: retrolarium-studio
jobs:
  python:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-studio
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "python"], check=True)
  native:
    name: Native Qt tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-studio
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host Qt, build and run native tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/ci_native.py"], check=True)
